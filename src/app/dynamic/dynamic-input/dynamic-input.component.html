<div [formGroup]="formGroup" class="form-group floating-label">
  <input
    type="text"
    [id]="config.name"
    [formControlName]="config.name"
    [placeholder]="config.placeholder || ' '"
  />
  <label [for]="config.name">
    {{ config.label }}
    <span *ngIf="config.required" class="required-asterisk">*</span>
  </label>
  <small class="note">{{ config.note }}</small>
</div>
