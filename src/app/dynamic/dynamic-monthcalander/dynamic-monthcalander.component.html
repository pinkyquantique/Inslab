<div class="form-group">
  <label [for]="config.name">
    {{ config.label }}
    <span *ngIf="config.required" class="required-asterisk">*</span>
  </label>

  <div class="input-group">
    <div class="input-container">
      <span class="calendar-icon" (click)="togglePicker($event)">
        <i class="bi bi-calendar"></i>
      </span>
      <input
        type="text"
        class="form-control"
        placeholder="{{ config.placeholder }}"
        [value]="formattedDate"
        readonly
        (click)="togglePicker($event)"
      />
    </div>
  </div>

  <div
    #picker
    class="dropdown-picker card p-3"
    *ngIf="showPicker"
    [ngStyle]="{ top: pickerPosition.top, left: pickerPosition.left }"
  >
    <div class="picker-header">
      <button class="btn btn-outline-primary me-2" (click)="prevYear()">←</button>
      <span class="year-label">{{ selectedYear }}</span>
      <button class="btn btn-outline-primary ms-2" (click)="nextYear()">→</button>
    </div>

    <div class="month-grid mt-3">
      <button
        *ngFor="let month of months; let i = index"
        class="month-button"
        [class.selected]="selectedMonth === i"
        (click)="selectMonth(i)"
      >
        {{ month }}
      </button>
    </div>
  </div>
</div>
